<text x="490.0" y="33" text-anchor="middle" fill="#E2E8F0" font-size="15" font-weight="600">ms-model — estructura de directorios</text>
<text x="34" y="78" fill="#64748B" font-size="13">Python 3.11 · FastAPI · XGBoost · SHAP</text>
<text x="34" y="100" fill="#1E293B" font-size="15" font-weight="600">🗂 ms-model/</text>
<text x="38" y="124" fill="#334155" font-size="15">└─</text>
<text x="56" y="124" fill="#5B8DEF" font-size="15" font-weight="600">📁 app/</text>
<text x="60" y="148" fill="#334155" font-size="15">└─</text>
<text x="78" y="148" fill="#5B8DEF" font-size="15" font-weight="600">📁 api/  (risk_router.py — FastAPI routers)</text>
<text x="60" y="172" fill="#334155" font-size="15">└─</text>
<text x="78" y="172" fill="#5B8DEF" font-size="15" font-weight="600">📁 core/  (settings, lifespan, logging)</text>
<text x="60" y="196" fill="#334155" font-size="15">└─</text>
<text x="78" y="196" fill="#5B8DEF" font-size="15" font-weight="600">📁 schemas/  (Pydantic v2 request/response models)</text>
<text x="60" y="220" fill="#334155" font-size="15">└─</text>
<text x="78" y="220" fill="#5B8DEF" font-size="15" font-weight="600">📁 services/  (inference, SHAP explainability)</text>
<text x="60" y="244" fill="#334155" font-size="15">└─</text>
<text x="78" y="244" fill="#94A3B8" font-size="15" font-weight="400">📄 ml_artifacts/  (XGBoost model + encoders, .pkl)</text>
<text x="60" y="268" fill="#334155" font-size="15">└─</text>
<text x="78" y="268" fill="#94A3B8" font-size="15" font-weight="400">📄 main.py  (ASGI entry point)</text>
<text x="38" y="292" fill="#334155" font-size="15">└─</text>
<text x="56" y="292" fill="#5B8DEF" font-size="15" font-weight="600">📁 tests/  (pytest unit + integration)</text>
<text x="38" y="316" fill="#334155" font-size="15">└─</text>
<text x="56" y="316" fill="#5B8DEF" font-size="15" font-weight="600">📁 training/  (offline model-training scripts)</text>
<text x="38" y="340" fill="#334155" font-size="15">└─</text>
<text x="56" y="340" fill="#5B8DEF" font-size="15" font-weight="600">📁 resources/</text>
<text x="38" y="364" fill="#334155" font-size="15">└─</text>
<text x="56" y="364" fill="#94A3B8" font-size="15" font-weight="400">📄 Dockerfile  (multi-stage, Python 3.11+)</text>
<text x="38" y="388" fill="#334155" font-size="15">└─</text>
<text x="56" y="388" fill="#94A3B8" font-size="15" font-weight="400">📄 pyproject.toml</text>
