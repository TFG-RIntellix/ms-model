version: '3.9'

services:
  ms-model:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-model-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # Opcional: para desarrollo con volúmenes
    # volumes:
    #   - ./app:/app/app
    #   - ./resources:/app/resources
    networks:
      - ms-network

networks:
  ms-network:
    driver: bridge
