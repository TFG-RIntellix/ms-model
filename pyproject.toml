[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-model"
version = "1.0.0"
description = "Credit Risk Engine microservice — XGBoost + SHAP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Lucia Fernandez Mancebo" }]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "packaging==24.2",
    "xgboost==2.0.3",
    "shap==0.46.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.4.2"
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "httpx==0.25.0",
    "jupyter==1.0.0",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["training*", "resources*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP"]
ignore = ["D203", "D213"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true